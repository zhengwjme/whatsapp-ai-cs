<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WhatsApp Bot Admin</title>
<style>
  :root { --bg: #f6f7f9; --panel: #fff; --line: #e2e5ea; --text: #1d2330; --muted: #6b7280;
          --ok: #15803d; --warn: #b45309; --bad: #b91c1c; --user: #eef2f7; --bot: #e7f5ec; --op: #fdf1e3; --sel: #e8effc; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.45 system-ui, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); }
  header { display: flex; align-items: center; gap: 12px; padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
  header h1 { font-size: 16px; margin: 0; flex: 1; }
  .badge { padding: 2px 10px; border-radius: 99px; font-size: 13px; border: 1px solid currentColor; }
  .open { color: var(--ok); } .connecting, .qr { color: var(--warn); } .loggedOut, .offline { color: var(--bad); }
  button { font: inherit; padding: 4px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); cursor: pointer; }
  main { display: grid; grid-template-columns: minmax(260px, 360px) 1fr; height: calc(100vh - 49px); }
  #list { overflow-y: auto; border-right: 1px solid var(--line); background: var(--panel); margin: 0; padding: 0; list-style: none; }
  #list li { padding: 10px 14px; border-bottom: 1px solid var(--line); cursor: pointer; }
  #list li.sel { background: var(--sel); }
  .row { display: flex; justify-content: space-between; gap: 8px; }
  .phone { font-weight: 600; }
  .muted { color: var(--muted); font-size: 12px; }
  .last { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--muted); }
  .hand { color: var(--warn); font-size: 12px; }
  #detail { display: flex; flex-direction: column; min-height: 0; }
  #thread { flex: 1; overflow-y: auto; padding: 16px; }
  #composer { display: flex; gap: 8px; align-items: flex-end; padding: 10px 16px; border-top: 1px solid var(--line); background: var(--panel); }
  #composer[hidden] { display: none; }
  #composer textarea { flex: 1; font: inherit; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; resize: vertical; min-height: 38px; }
  #composer .note { font-size: 12px; }
  #thread h2 { font-size: 15px; margin: 0 0 8px; }
  .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 12px; }
  button:disabled { opacity: .45; cursor: default; }
  .msg { max-width: 70ch; margin: 6px 0; padding: 6px 10px; border-radius: 8px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg.user { background: var(--user); } .msg.assistant { background: var(--bot); margin-left: 40px; } .msg.operator { background: var(--op); margin-left: 40px; }
  .who { font-size: 12px; font-weight: 600; color: var(--muted); }
  .empty { color: var(--muted); padding: 16px; }
  nav button.on { background: var(--sel); }
  [hidden] { display: none !important; }
  #settings { max-width: 820px; margin: 0 auto; padding: 16px; height: calc(100vh - 49px); overflow-y: auto; }
  #settings label { display: block; margin: 14px 0 4px; font-weight: 600; }
  #settings .hint { font-weight: 400; color: var(--muted); font-size: 12px; }
  #settings input:not([type=checkbox]), #settings textarea { width: 100%; font: inherit; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; }
  #settings .bad { border-color: var(--bad) !important; outline: 1px solid var(--bad); }
  #settings .save { display: flex; align-items: center; gap: 12px; margin: 18px 0 32px; }
  #link { max-width: 560px; margin: 0 auto; padding: 24px 16px; }
  #link h2 { margin: 0 0 8px; font-size: 20px; }
  #qr { width: 280px; max-width: 100%; margin: 12px 0; }
  #qr svg { display: block; width: 100%; height: auto; }
  #link .box { margin: 18px 0; padding-top: 14px; border-top: 1px solid var(--line); }
  #link input { font: inherit; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; width: 16em; }
  #pairCode { font: 600 28px/1.2 ui-monospace, Consolas, monospace; letter-spacing: 3px; margin: 10px 0; }
  .danger { color: var(--bad); border-color: var(--bad); }
  dialog { border: 1px solid var(--line); border-radius: 10px; max-width: 420px; padding: 20px; }
  dialog::backdrop { background: rgb(0 0 0 / .35); }
  #status { cursor: pointer; background: none; }
  .okmsg { color: var(--ok); } .warnmsg { color: var(--warn); } .errmsg { color: var(--bad); }
  @media (max-width: 700px) { main { grid-template-columns: 1fr; height: auto; } #list { max-height: 40vh; border-right: 0; } }
</style>
</head>
<body>
<header>
  <h1 data-t="title"></h1>
  <nav><button id="tabChats" data-t="chats"></button> <button id="tabSettings" data-t="settings"></button> <button id="tabLink" data-t="whatsapp"></button></nav>
  <button id="status" class="badge"></button>
  <button id="lang"></button>
</header>
<main>
  <ul id="list"></ul>
  <section id="detail">
    <div id="thread"></div>
    <form id="composer" hidden>
      <textarea id="text" rows="2"></textarea>
      <div><button id="send" type="submit"></button><div id="sendNote" class="note hand"></div></div>
    </form>
  </section>
</main>
<section id="link" hidden>
  <h2 id="linkTitle"></h2>
  <p id="linkText"></p>
  <div id="qr"></div>
  <form id="pair" class="box" hidden>
    <label><span data-t="pairTitle"></span><br><span class="muted" data-t="pairHint"></span><br>
      <input id="phone" inputmode="numeric" autocomplete="tel" placeholder="447700900123"> <button type="submit" data-t="pairGo"></button></label>
    <div id="pairCode"></div>
    <div id="pairNote"></div>
  </form>
  <div class="box"><button id="relink" class="danger"></button></div>
</section>
<dialog id="confirm">
  <p data-t="relinkWarn"></p>
  <form method="dialog"><button value="cancel" data-t="cancel"></button> <button value="ok" class="danger" data-t="relinkGo"></button></form>
</dialog>
<form id="settings" hidden>
  <label><span data-t="f_SYSTEM_PROMPT"></span> <span class="hint" data-t="h_SYSTEM_PROMPT"></span>
    <textarea name="SYSTEM_PROMPT" rows="14"></textarea></label>
  <label><span data-t="f_HANDOFF_TEXT"></span> <span class="hint" data-t="h_HANDOFF_TEXT"></span>
    <textarea name="HANDOFF_TEXT" rows="2"></textarea></label>
  <label><span data-t="f_PAUSE_KEYWORD"></span> <span class="hint" data-t="h_PAUSE_KEYWORD"></span>
    <textarea name="PAUSE_KEYWORD" rows="5"></textarea></label>
  <label><span data-t="f_PAUSE_HOURS"></span> <input name="PAUSE_HOURS" type="number" min="0" step="any"></label>
  <label><span data-t="f_HISTORY_TURNS"></span> <span class="hint" data-t="h_HISTORY_TURNS"></span>
    <input name="HISTORY_TURNS" type="number" min="1" step="1"></label>
  <label><input name="REPLY_GROUPS" type="checkbox"> <span data-t="f_REPLY_GROUPS"></span></label>
  <label><span data-t="f_OPENAI_BASE_URL"></span> <input name="OPENAI_BASE_URL" type="url"></label>
  <label><span data-t="f_OPENAI_API_KEY"></span> <span class="hint" data-t="h_OPENAI_API_KEY"></span>
    <input name="OPENAI_API_KEY" type="password" autocomplete="off"></label>
  <label><span data-t="f_OPENAI_MODEL"></span> <input name="OPENAI_MODEL"></label>
  <label><span data-t="f_LLM_TIMEOUT_MS"></span> <input name="LLM_TIMEOUT_MS" type="number" min="1" step="1"></label>
  <div class="save"><button type="submit" data-t="save"></button><span id="saveNote"></span></div>
</form>
<script>
const T = {
  en: { title: 'WhatsApp Bot Admin', switch: '中文', open: 'Connected', connecting: 'Reconnecting…', qr: 'Login required',
        loggedOut: 'Logged out', offline: 'Admin server unreachable', noChats: 'No chats yet', pick: 'Select a chat to see its history',
        user: 'Customer', assistant: 'Bot', operator: 'Operator', more: 'Load more', bot: 'Bot is replying',
        left: (h, m) => `Handoff · ${h}h ${m}m left`, handoff: 'Hand off to human', rehandoff: 'Restart handoff timer',
        resume: 'Resume bot', failed: 'Action failed', send: 'Send', sending: 'Sending…', placeholder: 'Reply to the customer (counts as operator takeover)',
        notConnected: 'WhatsApp is not connected, cannot send', sendFailed: 'Not sent: ',
        chats: 'Chats', settings: 'Settings', save: 'Save', saved: 'Saved. The bot uses the new settings now.',
        invalid: 'Please fix this field: ', saveFailed: 'Not saved: ',
        f_SYSTEM_PROMPT: 'What the bot knows and how it talks (SYSTEM_PROMPT)', h_SYSTEM_PROMPT: 'Keep the [[HANDOFF]] instruction',
        f_HANDOFF_TEXT: 'Handoff message', h_HANDOFF_TEXT: 'Sent to the customer when a chat is handed to a human',
        f_PAUSE_KEYWORD: 'Phrases that ask for a human', h_PAUSE_KEYWORD: 'One phrase per line, not case-sensitive. Use phrases, not single words',
        f_PAUSE_HOURS: 'Hours the bot stays quiet after a handoff', f_HISTORY_TURNS: 'Recent messages sent to the model',
        h_HISTORY_TURNS: 'A question and its answer count as 2', f_REPLY_GROUPS: 'Also reply in group chats',
        f_OPENAI_BASE_URL: 'Model API address', f_OPENAI_API_KEY: 'API key', h_OPENAI_API_KEY: 'Leave blank to keep the current key',
        f_OPENAI_MODEL: 'Model name', f_LLM_TIMEOUT_MS: 'Model timeout (ms)', keySet: 'Current: ', keyUnset: 'Not set',
        noMark: 'SYSTEM_PROMPT no longer mentions [[HANDOFF]], so the bot will never hand a chat over when it cannot answer.',
        whatsapp: 'WhatsApp', t_open: 'Connected', x_open: 'The bot is replying to customers.',
        t_connecting: 'Connecting…', x_connecting: 'Please wait a few seconds.',
        t_qr: 'Link this computer to WhatsApp', x_qr: 'On your phone open WhatsApp → Settings → Linked devices → Link a device, then scan this code. The code refreshes by itself.',
        t_loggedOut: 'Logged out', x_loggedOut: 'This computer was removed from WhatsApp. Click “Link again” below.',
        t_offline: 'Admin server unreachable', x_offline: 'Check that the bot window is still open.',
        pairTitle: 'Or link with a phone number', pairHint: 'Country code first, digits only, no + or spaces (UK example: 447700900123)',
        pairGo: 'Get pairing code', pairUse: 'On your phone: Linked devices → Link a device → Link with phone number instead, then enter this code.',
        badPhone: 'Digits only, starting with the country code, no + or spaces.',
        relink: 'Log out and relink', relinkWarn: 'This logs the bot out of WhatsApp and deletes its login. The bot stops replying to customers until you link it again. Continue?',
        cancel: 'Cancel', relinkGo: 'Log out and relink', linkAgain: 'Link again' },
  zh: { title: 'WhatsApp 机器人管理', switch: 'English', open: '已连接', connecting: '断线重连中', qr: '需要登录',
        loggedOut: '已登出', offline: '管理服务无法访问', noChats: '还没有会话', pick: '选择一个会话查看历史',
        user: '客户', assistant: '机器人', operator: '运营', more: '加载更多', bot: '机器人接待中',
        left: (h, m) => `转人工中 · 剩 ${h} 小时 ${m} 分`, handoff: '手动转人工', rehandoff: '重新计满转人工期',
        resume: '恢复接待', failed: '操作失败', send: '发送', sending: '发送中…', placeholder: '回复客户（视为运营接管）',
        notConnected: 'WhatsApp 未连接，无法发送', sendFailed: '没发出去：',
        chats: '会话', settings: '配置', save: '保存', saved: '已保存，机器人已按新配置工作。',
        invalid: '请修改这一项：', saveFailed: '没保存：',
        f_SYSTEM_PROMPT: '机器人知道什么、怎么说话（SYSTEM_PROMPT）', h_SYSTEM_PROMPT: '保留 [[HANDOFF]] 约定',
        f_HANDOFF_TEXT: '转人工话术', h_HANDOFF_TEXT: '转人工时发给客户的话',
        f_PAUSE_KEYWORD: '转人工关键词', h_PAUSE_KEYWORD: '每行一个，不分大小写；用词组，别用单个词',
        f_PAUSE_HOURS: '转人工期时长（小时）', f_HISTORY_TURNS: '发给模型的会话历史条数',
        h_HISTORY_TURNS: '一问一答算 2 条', f_REPLY_GROUPS: '也回复群聊',
        f_OPENAI_BASE_URL: '模型地址', f_OPENAI_API_KEY: 'API Key', h_OPENAI_API_KEY: '留空表示不改',
        f_OPENAI_MODEL: '模型名', f_LLM_TIMEOUT_MS: '模型超时（毫秒）', keySet: '当前：', keyUnset: '未设置',
        noMark: 'SYSTEM_PROMPT 里没有 [[HANDOFF]] 约定，机器人答不上来时不会再转人工。',
        whatsapp: 'WhatsApp', t_open: '已连接', x_open: '机器人正在接待客户。',
        t_connecting: '连接中…', x_connecting: '请稍等几秒。',
        t_qr: '把这台电脑关联到 WhatsApp', x_qr: '在手机上打开 WhatsApp → 设置 → 已关联的设备 → 关联新设备，扫描下面的二维码。二维码会自动刷新。',
        t_loggedOut: '已登出', x_loggedOut: '这台电脑已从 WhatsApp 移除。点下面的“重新关联”。',
        t_offline: '管理服务无法访问', x_offline: '请检查机器人窗口是否还开着。',
        pairTitle: '或者用手机号关联', pairHint: '国家码开头，只填数字，不要 + 和空格（英国示例：447700900123）',
        pairGo: '获取配对码', pairUse: '在手机上：已关联的设备 → 关联新设备 → 改用手机号关联，然后输入这个配对码。',
        badPhone: '只填数字，国家码开头，不要 + 和空格。',
        relink: '退出并重新关联', relinkWarn: '这会让机器人退出 WhatsApp 并删除登录信息。重新关联之前，机器人不会回复客户。确定继续？',
        cancel: '取消', relinkGo: '退出并重新关联', linkAgain: '重新关联' },
};
let lang = 'en';
try { lang = localStorage.getItem('lang') === 'zh' ? 'zh' : 'en'; } catch {}
const t = k => T[lang][k];

let state = 'connecting', qrSvg = '', chats = [], openChat = null, msgs = [], hasMore = false, actFailed = false;
let firstStatus = true;
let sending = false, sendError = '';
const PAGE = 200;

const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const phone = chat => chat.split('@')[0];
const time = ts => new Date(ts).toLocaleString(lang === 'zh' ? 'zh-CN' : 'en-GB', { dateStyle: 'short', timeStyle: 'short' });
const handoff = until => {
  const ms = until - Date.now();
  if (ms <= 0) return null;
  const mins = Math.ceil(ms / 60e3);
  return t('left')(Math.floor(mins / 60), mins % 60);
};
const get = async (path, method, body) => {
  const r = await fetch(path, { method, body: body && JSON.stringify(body) });
  if (!r.ok) throw new Error((await r.json()).error);
  return r.json();
};
const historyUrl = (chat, before) => `/api/chats/${encodeURIComponent(chat)}/messages` + (before ? `?before=${before}` : '');

function render() {
  document.documentElement.lang = lang;
  document.title = t('title');
  document.querySelectorAll('[data-t]').forEach(e => { e.textContent = t(e.dataset.t); });
  document.getElementById('lang').textContent = t('switch');
  const s = document.getElementById('status');
  s.className = `badge ${state}`; s.textContent = t(state);
  renderLink();

  const list = document.getElementById('list');
  list.replaceChildren(...(chats.length ? chats.map(c => {
    const li = el('li', c.chat === openChat ? 'sel' : '');
    const top = el('div', 'row');
    const who = el('span');
    who.append(el('span', 'phone', phone(c.chat)));
    if (c.name) who.append(' ', el('span', 'muted', c.name));
    top.append(who, el('span', 'muted', time(c.ts)));
    li.append(top, el('div', 'last', c.last), el('div', handoff(c.until) ? 'hand' : 'muted', handoff(c.until) || t('bot')));
    li.onclick = () => select(c.chat);
    return li;
  }) : [el('li', 'empty', t('noChats'))]));

  const detail = document.getElementById('thread');
  renderComposer();
  if (!openChat) return detail.replaceChildren(el('p', 'empty', t('pick')));
  const nodes = [el('h2', null, phone(openChat))];
  const left = handoff(chats.find(c => c.chat === openChat)?.until || 0);
  const acts = el('div', 'actions');
  const handoffBtn = el('button', null, t(left ? 'rehandoff' : 'handoff'));
  const resumeBtn = el('button', null, t('resume'));
  handoffBtn.onclick = () => act('handoff');
  resumeBtn.onclick = () => act('resume');
  resumeBtn.disabled = !left;               // 不在转人工期就没什么可恢复的
  acts.append(handoffBtn, resumeBtn, el('span', left ? 'hand' : 'muted', left || t('bot')));
  if (actFailed) acts.append(el('span', 'hand', t('failed')));
  nodes.push(acts);
  if (hasMore) { const b = el('button', null, t('more')); b.onclick = loadMore; nodes.push(b); }
  for (const m of [...msgs].reverse()) {
    const d = el('div', `msg ${m.role}`);
    d.append(el('div', 'who', `${t(m.role)} · ${time(m.ts)}`), el('div', null, m.content));
    nodes.push(d);
  }
  const atBottom = detail.scrollHeight - detail.scrollTop - detail.clientHeight < 40;
  detail.replaceChildren(...nodes);
  if (atBottom) detail.scrollTop = detail.scrollHeight;
}

async function refresh() {
  try {
    let status;
    [status, chats] = await Promise.all([get('/api/status'), get('/api/chats')]);
    ({ state } = status); qrSvg = status.qrSvg || '';
    if (firstStatus && (state === 'qr' || state === 'loggedOut')) showTab('link');   // 需要登录：打开就直接看到二维码
    firstStatus = false;
    if (openChat) {
      const chat = openChat, latest = await get(historyUrl(chat));
      if (chat === openChat) {             // 轮询只刷最新一页；已加载的更早消息接在后面
        if (!msgs.length) hasMore = latest.length === PAGE;
        const oldest = latest.at(-1)?.id ?? Infinity;
        msgs = [...latest, ...msgs.filter(m => m.id < oldest)];
      }
    }
  } catch { state = 'offline'; }
  render();
}

async function select(chat) {
  openChat = chat; msgs = []; hasMore = false; actFailed = false; sendError = '';
  document.getElementById('text').value = '';
  render();
  await refresh();
  const detail = document.getElementById('thread');
  detail.scrollTop = detail.scrollHeight;
}

// 输入框不随轮询重建（否则打到一半的字会丢），这里只更新文案和可用状态
function renderComposer() {
  const form = document.getElementById('composer'), btn = document.getElementById('send');
  form.hidden = !openChat;
  document.getElementById('text').placeholder = t('placeholder');
  btn.textContent = t(sending ? 'sending' : 'send');
  btn.disabled = sending || state !== 'open';
  document.getElementById('sendNote').textContent = state !== 'open' ? t('notConnected') : sendError && t('sendFailed') + sendError;
}

document.getElementById('composer').onsubmit = async e => {
  e.preventDefault();
  const box = document.getElementById('text'), text = box.value, chat = openChat;
  if (!text.trim() || sending) return;
  sending = true; sendError = ''; renderComposer();
  try {
    await get(`/api/chats/${encodeURIComponent(chat)}/send`, 'POST', { text });
    if (chat === openChat) box.value = '';            // 发成功才清空；失败保留，方便重试
  } catch (err) { sendError = err.message; }
  sending = false;
  await refresh();
};

async function act(action) {             // 手动转人工 / 恢复接待，做完立刻刷新状态
  actFailed = false;
  try { await get(`/api/chats/${encodeURIComponent(openChat)}/${action}`, 'POST'); }
  catch { actFailed = true; }
  await refresh();
}

async function loadMore() {
  const chat = openChat, older = await get(historyUrl(chat, msgs.at(-1).id));
  if (chat !== openChat) return;
  msgs = [...msgs, ...older]; hasMore = older.length === PAGE;
  const detail = document.getElementById('thread'), fromBottom = detail.scrollHeight - detail.scrollTop;
  render();
  detail.scrollTop = detail.scrollHeight - fromBottom;   // 往前翻时保持当前位置
}

/* ---------- 配置页：打开时读一次，不随轮询刷新（免得冲掉正在改的内容） ---------- */
const form = document.getElementById('settings');
let keyMasked = '';

function showTab(name) {
  document.querySelector('main').hidden = name !== 'chats';
  form.hidden = name !== 'settings';
  document.getElementById('link').hidden = name !== 'link';
  for (const [id, tab] of [['tabChats', 'chats'], ['tabSettings', 'settings'], ['tabLink', 'link']]) {
    document.getElementById(id).className = name === tab ? 'on' : '';
  }
  if (name === 'settings') loadSettings();
  if (name === 'link') get('/api/config').then(c => { if (!phoneInput.value) phoneInput.value = c.WHATSAPP_PHONE; }).catch(() => {});
}

async function loadSettings() {
  note('', '');
  const c = await get('/api/config').catch(() => null);
  if (!c) return note('errmsg', t('offline'));
  for (const [k, v] of Object.entries(c)) {
    const input = form.elements[k];
    if (k === 'OPENAI_API_KEY') { input.value = ''; keyMasked = v.set ? v.masked : ''; }
    else if (k === 'PAUSE_KEYWORD') input.value = v.join('\n');
    else if (input.type === 'checkbox') input.checked = v;
    else input.value = v;
  }
  renderKeyHint();
}

function renderKeyHint() {
  form.elements.OPENAI_API_KEY.placeholder = keyMasked ? t('keySet') + keyMasked : t('keyUnset');
}

function note(cls, text) {
  const n = document.getElementById('saveNote');
  n.className = cls; n.textContent = text;
}

form.onsubmit = async e => {
  e.preventDefault();
  form.querySelectorAll('.bad').forEach(i => i.classList.remove('bad'));
  const body = {};
  for (const input of form.querySelectorAll('[name]')) {
    body[input.name] = input.type === 'checkbox' ? input.checked
      : input.name === 'PAUSE_KEYWORD' ? input.value.split('\n').map(k => k.trim()).filter(Boolean)
      : input.value;
  }
  const r = await fetch('/api/config', { method: 'POST', body: JSON.stringify(body) }).catch(() => null);
  const res = r && await r.json().catch(() => ({}));
  if (!r) return note('errmsg', t('offline'));
  if (res.field && form.elements[res.field]) {
    form.elements[res.field].classList.add('bad');
    form.elements[res.field].focus();
    return note('errmsg', t('invalid') + t(`f_${res.field}`));
  }
  if (!r.ok) return note('errmsg', t('saveFailed') + res.error);
  await loadSettings();
  note(res.warning ? 'warnmsg' : 'okmsg', res.warning ? `${t('saved')} ⚠ ${t('noMark')}` : t('saved'));
};

/* ---------- WhatsApp 连接页：二维码 / 配对码 / 退出并重新关联 ---------- */
const phoneInput = document.getElementById('phone');
let shownQr = '', pairCode = '';

function renderLink() {
  document.getElementById('linkTitle').textContent = t(`t_${state}`);
  document.getElementById('linkText').textContent = t(`x_${state}`);
  if (state !== 'qr') pairCode = '';                   // 登上了/断了，旧配对码作废
  const shown = state === 'qr' ? qrSvg : '';
  if (shown !== shownQr) document.getElementById('qr').innerHTML = shownQr = shown;   // 服务端生成的 SVG，只在换码时重画
  document.getElementById('pair').hidden = state !== 'qr';
  document.getElementById('pairCode').textContent = pairCode;
  document.getElementById('relink').textContent = t(state === 'loggedOut' ? 'linkAgain' : 'relink');
  if (pairCode) document.getElementById('pairNote').textContent = t('pairUse');
}

document.getElementById('pair').onsubmit = async e => {
  e.preventDefault();
  const noteEl = document.getElementById('pairNote'), number = phoneInput.value.trim();
  pairCode = ''; noteEl.className = 'errmsg';
  if (!/^\d{7,15}$/.test(number)) { noteEl.textContent = t('badPhone'); return renderLink(); }
  noteEl.textContent = '';
  try {
    pairCode = (await get('/api/pair', 'POST', { phone: number })).code;
    noteEl.className = '';
  } catch (err) { noteEl.textContent = err.message; }
  renderLink();
};

const confirmDialog = document.getElementById('confirm');
const relink = async () => { await get('/api/relink', 'POST').catch(() => {}); await refresh(); };
// 已登出时没什么可丢的，直接重新关联；否则先确认（机器人会停止回复）
document.getElementById('relink').onclick = () => (state === 'loggedOut' ? relink() : confirmDialog.showModal());
confirmDialog.onclose = () => {
  if (confirmDialog.returnValue !== 'ok') return;
  confirmDialog.returnValue = '';
  relink();
};

document.getElementById('tabChats').onclick = () => showTab('chats');
document.getElementById('tabSettings').onclick = () => showTab('settings');
document.getElementById('tabLink').onclick = () => showTab('link');
document.getElementById('status').onclick = () => showTab('link');
showTab('chats');

document.getElementById('lang').onclick = () => {
  lang = lang === 'en' ? 'zh' : 'en';
  try { localStorage.setItem('lang', lang); } catch {}
  render();
  renderKeyHint();
};
refresh();
setInterval(refresh, 3000);
</script>
