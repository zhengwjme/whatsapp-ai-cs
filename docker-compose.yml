services:
  waha:
    image: devlikeapro/waha:latest        # Core 版免费，engine NOWEB(Baileys)，单容器
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"             # 只监听本机，不暴露到局域网（面板 + Swagger）
    volumes: ["waha-sessions:/app/.sessions"]   # 扫码登录态，删了要重新扫码
    environment:
      WHATSAPP_API_KEY: ${WHATSAPP_API_KEY:-change-me}
      WHATSAPP_HOOK_URL: ${WAHA_HOOK_URL:-http://bot:8787/webhook}
      WHATSAPP_HOOK_EVENTS: message.any,session.status   # message.any 含本号发出的消息：运营直接回复即接管
  bot:
    build: .                              # 本地构建，无 bind mount（Windows 上 bind mount 又慢又有坑）
    image: whatsapp1-bot:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:8787:8787"             # 只为在 Windows 上 curl 自测
    volumes: ["bot-data:/data"]           # SQLite 落这里
    environment:
      DATA_DIR: /data
      WAHA_URL: http://waha:3000
      WAHA_API_KEY: ${WHATSAPP_API_KEY:-change-me}
      WAHA_SESSION: default
      WAHA_TIMEOUT_MS: ${WAHA_TIMEOUT_MS:-15000}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.deepseek.com/v1}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-deepseek-chat}
      LLM_TIMEOUT_MS: ${LLM_TIMEOUT_MS:-30000}
      SYSTEM_PROMPT: ${SYSTEM_PROMPT:-你是外贸客服助手，简洁专业，先答问题再问需求。不确定的不要编：能答的部分照常回答，答不上来的在回复末尾附上 [[HANDOFF]]，不要自己说转人工。}
      REPLY_GROUPS: "false"
      PAUSE_KEYWORD: 人工,转人工,human agent,real person
      PAUSE_HOURS: "12"
volumes:
  waha-sessions:
  bot-data:
